<!doctype html>
<html lang="zh-Hant-TW" data-convention="tw">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbfbf8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e1424" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Forliosa：以台股為主的投資管理——跨券商持倉帳本、真實報酬、個股估值與先寫草稿再請你簽名的 AI。" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Forliosa｜帳本</title>
    <script>
      // 在 React 載入前套用主題與漲跌慣例，避免閃爍
      try {
        var raw = localStorage.getItem("forliosa:prefs")
        var s = raw ? JSON.parse(raw).state : null
        var theme = (s && s.theme) || "system"
        var dark = theme === "dark" || (theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches)
        if (dark) document.documentElement.classList.add("dark")
        if (s && s.colorConvention) document.documentElement.dataset.convention = s.colorConvention
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
