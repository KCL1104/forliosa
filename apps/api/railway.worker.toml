# Railway config-as-code for the **worker** service (same image, different start command).
# Service settings: Root Directory = apps/api, Config File Path = /apps/api/railway.worker.toml
# Migrations are run by the api service only.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["apps/api/**"]

[deploy]
startCommand = "python -m forliosa.worker"
restartPolicyType = "ALWAYS"

# Environment variables are set in the Railway service settings, not here. DATA_POLICY defaults to
# `commercial` (only legally commercially usable open data, never demo data); do not set it to `personal`
# on a deployment other people use. MARKET_DATA_PROVIDERS default: archive,twse_openapi,tpex_openapi,
# shioaji_data,demo (no FinMind; the TWSE MIS provider no longer exists).
