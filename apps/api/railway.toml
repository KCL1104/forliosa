# Railway config-as-code for the **api** service.
# Service settings: Root Directory = apps/api, Config File Path = /apps/api/railway.toml
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["apps/api/**"]

[deploy]
# The Dockerfile CMD runs `alembic upgrade head` and then uvicorn on $PORT.
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
